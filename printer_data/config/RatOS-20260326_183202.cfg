#############################################################################################################
### BASE SETUP
#############################################################################################################
[include RatOS/homing.cfg]
[include RatOS/macros.cfg]
[include RatOS/shell-macros.cfg]
[include RatOS/printers/v-core-4/v-core-4.cfg]
[include RatOS/printers/v-core-4/macros.cfg]
[include RatOS/printers/v-core-4/500.cfg]

# Extruder
# T0 Orbiter 2 definition (from RatOS/extruders/orbiter-2.cfg)
[extruder]
rotation_distance: 4.63
full_steps_per_rotation: 200
filament_diameter: 1.750
max_extrude_only_velocity: 60

[firmware_retraction]
retract_speed: 60
unretract_extra_length: 0
unretract_speed: 60

# Hotend
# T0 Phaetus Rapido Plus UHF definition (from RatOS/hotends/rapido-plus-uhf.cfg)
[extruder]
max_extrude_only_distance: 200
nozzle_diameter: 0.4
heater_pin: toolboard_t0:PB9
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: toolboard_t0:PA1
min_extrude_temp: 170
min_temp: 0
max_temp: 350
pressure_advance: 0.03

[firmware_retraction]
retract_length: 0.5

# Orbitool O2s hotend heater settings
[extruder]
# The hotend heater power must be limited to 99.5% (max_power: 0.995) to enable the correct operation of Orbitool O2s protection features. Do not set max_power to a value greater than 0.995.
max_power: 0.995
# To improve the heater power calculation accuracy, the heater PWM is forced to 100Hz (instead of the 10Hz default of Klipper).
pwm_cycle_time: 0.01

# ADXL345 resonance testing configuration
[resonance_tester]
accel_chip_x: adxl345 toolboard_t0
accel_chip_y: adxl345 toolboard_t0
probe_points:
	250,250,20

#############################################################################################################
### STEPPER MOTORS, DRIVERS & SPEED LIMITS
#############################################################################################################
#---------------------------------------------------- X -----------------------------------------------------
# The A motor in the CoreXY system, located at the rear left of the printer
# Connected to MOTOR 0 on BIGTREETECH Octopus V1.1 F446
# Driver: BTT TMC2209 v1.3
# Motor: LDO-42STH48-2504AC
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2209 stepper_x]
stealthchop_threshold: 0
interpolate: False
uart_pin: PC4
run_current: 1.6
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6
sense_resistor: 0.11

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#---------------------------------------------------- Y -----------------------------------------------------
# The B motor in the CoreXY system, located at the rear right of the printer
# Connected to MOTOR 1 on BIGTREETECH Octopus V1.1 F446
# Driver: BTT TMC2209 v1.3
# Motor: LDO-42STH48-2504AC
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2209 stepper_y]
stealthchop_threshold: 0
interpolate: False
uart_pin: PD11
run_current: 1.6
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6
sense_resistor: 0.11

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 40
homing_speed: 50

#---------------------------------------------------- Z -----------------------------------------------------
# The left Z motor for the kinematic bed
# Connected to MOTOR 5 on BIGTREETECH Octopus V1.1 F446
# Driver: BTT TMC2209 v1.3
# Motor: LDO-42STH48-2504AC
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2209 stepper_z]
stealthchop_threshold: 0
interpolate: False
uart_pin: PE4
run_current: 1.6
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6
sense_resistor: 0.11

[stepper_z]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4
position_min: -5
homing_speed: 10
endstop_pin: probe:z_virtual_endstop

#---------------------------------------------------- Z1 ----------------------------------------------------
# The rear Z motor for the kinematic bed
# Connected to MOTOR 6 on BIGTREETECH Octopus V1.1 F446
# Driver: BTT TMC2209 v1.3
# Motor: LDO-42STH48-2504AC
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2209 stepper_z1]
stealthchop_threshold: 0
interpolate: False
uart_pin: PE1
run_current: 1.6
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6
sense_resistor: 0.11

[stepper_z1]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4

#---------------------------------------------------- Z2 ----------------------------------------------------
# The right Z motor for the kinematic bed
# Connected to MOTOR 7 on BIGTREETECH Octopus V1.1 F446
# Driver: BTT TMC2209 v1.3
# Motor: LDO-42STH48-2504AC
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2209 stepper_z2]
stealthchop_threshold: 0
interpolate: False
uart_pin: PD3
run_current: 1.6
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 0
driver_HSTRT: 6
sense_resistor: 0.11

[stepper_z2]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the toolhead
# Connected to Orbitool O2s
# Driver: LDO TMC2240 UART
# Motor: LDO-36STH20-1004AHG
# Voltage: 24
#------------------------------------------------------------------------------------------------------------
[tmc2240 extruder]
stealthchop_threshold: 0
interpolate: False
uart_pin: toolboard_t0:PC13
run_current: 0.707

[extruder]
step_pin: toolboard_t0:PB3
dir_pin: toolboard_t0:PB4
enable_pin: !toolboard_t0:PC14
microsteps: 64
full_steps_per_rotation: 200
rotation_distance: 4.63


[printer]
max_velocity: 800
max_accel: 10000
minimum_cruise_ratio: 0.5
max_z_velocity: 50
max_z_accel: 600
square_corner_velocity: 5

[gcode_macro RatOS]
variable_macro_travel_speed: 600
variable_macro_travel_accel: 8000

[bed_mesh]
speed: 600

[z_tilt]
speed: 600

#############################################################################################################
### HOMING
#############################################################################################################
[include RatOS/z-probe/beacon.cfg]


# Bed mesh area adjusted for beacon proximity sensing
[bed_mesh]
mesh_min: 20,20
mesh_max: 480,480

# Beacon contact mesh area adjusted for beacon contact sensing
[beacon]
contact_mesh_min: 20,20
contact_mesh_max: 480,480

# Enable adaptive heatsoak by default
[gcode_macro RatOS]
variable_beacon_adaptive_heat_soak: True

# Physical X endstop configuration
[stepper_x]
endstop_pin: toolboard_t0:PA2
[gcode_macro RatOS]
variable_homing_x: "endstop"

# Physical Y endstop configuration
[stepper_y]
endstop_pin: PG9
[gcode_macro RatOS]
variable_homing_y: "endstop"

#############################################################################################################
### FANS
#############################################################################################################
# Part cooling fan
[fan]
# 4-pin fan connected to 4-pin header on T0 (Orbitool O2s) - digital pwm
pin: toolboard_t0:PB0
cycle_time:  0.00004
tachometer_pin: ^toolboard_t0:PA14
tachometer_poll_interval: 0.0005
enable_pin: toolboard_t0:PB14

# Hotend cooling fan
[heater_fan toolhead_cooling_fan]
heater: extruder
shutdown_speed: 1
# 4-pin fan connected to 2-pin header on T0 (Orbitool O2s) - digital pwm
pin: toolboard_t0:PB15
cycle_time: 0.00004
# Use max_power: 0.5 for 12V, max_power: 1 for 24V (in printer.cfg)
max_power: 1

# Controller cooling fan
[controller_fan controller_fan]
# 2-pin fan connected to 2-pin header on Octopus V1.1 F446 - input voltage pwm
pin: PD12

#############################################################################################################
### ACCESSORIES
#############################################################################################################

# Filament sensors
# orbiter-smart-sensor connected to toolboard
[filament_switch_sensor toolhead_filament_sensor_t0]
pause_on_runout: False
event_delay: 1.0
switch_pin: ^toolboard_t0:PA8
runout_gcode:
	_ON_TOOLHEAD_FILAMENT_SENSOR_RUNOUT TOOLHEAD=0
insert_gcode:
	_ON_TOOLHEAD_FILAMENT_SENSOR_INSERT TOOLHEAD=0

[gcode_button filament_sensor_button]
pin: ^toolboard_t0:PA9
press_gcode:
    {% if (printer.print_stats.state == "printing") %}
        _ON_TOOLHEAD_FILAMENT_SENSOR_CLOG TOOLHEAD=0
    {% else %}
        _ON_FILAMENT_SENSOR_BUTTON_PRESSED TOOLHEAD=0
    {% endif %}
release_gcode:
	# No action on release





#############################################################################################################
### MACRO CONFIGURATION
#############################################################################################################
[gcode_macro T0]
variable_join: 0
variable_remap: 0
variable_alert: ""
variable_filament_name: ""
variable_filament_type: ""
variable_filament_temp: 0
variable_runout_sensor: ""
variable_active: True
variable_color: "7bff33"                                          # Used in frontends
variable_hotend_type: "UHF"
variable_has_cht_nozzle: False
variable_cooling_position_to_nozzle_distance: 40                  # heatbreak length from cold zone to nozzle
variable_tooolhead_sensor_to_extruder_gear_distance: 15           # distance in mm from the sensor to the extruder gear
variable_extruder_gear_to_cooling_position_distance: 30           # distance in mm from the extruder gear to the end of the hotend cold zone
variable_filament_loading_nozzle_offset: -5
variable_filament_grabbing_length: 5
variable_filament_grabbing_speed: 1
variable_enable_insert_detection: True                            # enables filament sensor insert detection 
variable_enable_runout_detection: True                            # enables filament sensor runout detection 
variable_enable_clog_detection: True                              # enables filament sensor clog detection 
variable_unload_after_runout: True                                # unload filament after a runout has been detected
variable_purge_after_load: 0
variable_purge_before_unload: 0
variable_extruder_load_speed: 60
variable_filament_load_speed: 10
variable_standby: False
variable_temperature_offset: 0                                    # hotend temperature offset
variable_has_oozeguard: False                                     # toolhead has a oozeguard
variable_has_front_arm_nozzle_wiper: False                        # toolhead has front arm nozzle wipers
variable_toolhead_sensor_button_only_when_sensor_enabled: False   # if True, the toolhead sensor action button is only enabled when the sensor is enabled
variable_toolhead_detect_clog_only_when_sensor_enabled: True      # if True, toolhead sensor clog detection is only enabled when the sensor is enabled
variable_resume_after_insert: False                               # resumes the print after inserting new filament
gcode:
	{% set x = params.X|default(-1.0)|float %}
	{% set y = params.Y|default(-1.0)|float %}
	{% set z = params.Z|default(0.0)|float %}
	{% set s = params.S|default(1)|int %}
	{% if printer["gcode_macro _SELECT_TOOL"] is defined %}
		_SELECT_TOOL T=0 X={x} Y={y} Z={z} TOOLSHIFT={s}
	{% endif %}

# Macro variable overrides
[gcode_macro RatOS]
variable_bed_margin_x: [59.6, 57.8]
variable_bed_margin_y: [14.35, 30]
variable_x_driver_types: ["tmc2209"]
variable_x_axes: ["x"]
variable_y_driver_types: ["tmc2209"]
variable_y_axes: ["y"]
variable_z_driver_types: ["tmc2209", "tmc2209", "tmc2209"]
variable_z_axes: ["z", "z1", "z2"]
variable_home_y_first: True

# Save variables
[save_variables]
filename: /home/pi/printer_data/config/ratos-variables.cfg